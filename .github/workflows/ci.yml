name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test Suite (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Runtime & Test Dependencies from Lockfile
        run: |
          uv pip install --system -r requirements-lock.txt
          uv pip install --system -r requirements-test.txt

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check .

      - name: Generate Synthetic Test Corpus
        run: |
          python tests/data/corpus/generate_corpus.py

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v
