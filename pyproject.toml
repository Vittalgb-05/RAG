[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".planning",
    ".cache",
    "data",
    "docs",
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501", "W291", "W293"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"start.py" = ["UP036"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
